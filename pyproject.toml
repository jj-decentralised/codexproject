[project]
name = "codex-memecoin-analytics"
version = "0.1.0"
description = "Publication-quality econometric analysis of meme coin markets using Codex.io API"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "pyarrow>=15.0",
    "tenacity>=8.2",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "lifelines>=0.29",
    "arch>=7.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "plotly>=5.18",
    "kaleido>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "config*"]
